<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" routerLink="/">
      <i class="bi bi-shop me-2 fs-4"></i>
      <span class="fw-bold">Gestión Negocios</span>
    </a>

    <div class="d-flex align-items-center">
      <!-- Usuario Autenticado -->
      <ng-container *ngIf="authService.currentUser$ | async as user; else anonTemplate">
        <div class="text-light me-3 d-flex align-items-center">
          <i class="bi bi-person-circle fs-5 me-2"></i>
          <div>
            <span class="fw-semibold">{{ user.nombre }} {{ user.apellido }}</span>
            <span
              class="badge ms-2"
              [ngClass]="user.rol === 'Administrador' ? 'bg-danger' : 'bg-primary'"
            >
              {{ user.rol }}
            </span>
            <span *ngIf="user.sucursalId" class="badge bg-secondary ms-1">
              Sucursal #{{ user.sucursalId }}
            </span>
          </div>
        </div>
        <button class="btn btn-outline-light btn-sm" (click)="onLogout()">
          <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
        </button>
      </ng-container>

      <!-- Usuario Anónimo -->
      <ng-template #anonTemplate>
        <a class="btn btn-primary btn-sm" routerLink="/login">
          <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar sesión
        </a>
      </ng-template>
    </div>
  </div>
</nav>

<main class="container-fluid p-0">
  <router-outlet></router-outlet>
</main>
