<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center me-4" routerLink="/">
      <i class="bi bi-shop me-2 fs-4 text-primary"></i>
      <span class="fw-bold">Gestión Negocios</span>
    </a>

    <!-- Enlaces de navegación principales -->
    <ul class="navbar-nav me-auto mb-2 mb-lg-0" *ngIf="authService.currentUser$ | async as user">
      <li class="nav-item">
        <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          <i class="bi bi-house me-1"></i> Inicio
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/productos" routerLinkActive="active">
          <i class="bi bi-box-seam me-1"></i> Productos
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/stock" routerLinkActive="active">
          <i class="bi bi-boxes me-1"></i> Stock
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/ventas" routerLinkActive="active">
          <i class="bi bi-receipt-cutoff me-1"></i> Ventas
        </a>
      </li>
      <ng-container *ngIf="user.rol === 'Administrador'">
        <li class="nav-item">
          <a class="nav-link" routerLink="/sucursales" routerLinkActive="active">
            <i class="bi bi-buildings me-1"></i> Sucursales
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/categorias" routerLinkActive="active">
            <i class="bi bi-tags me-1"></i> Categorías
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/usuarios" routerLinkActive="active">
            <i class="bi bi-people me-1"></i> Usuarios
          </a>
        </li>
      </ng-container>
    </ul>

    <div class="d-flex align-items-center ms-auto">
      <!-- Usuario Autenticado -->
      <ng-container *ngIf="authService.currentUser$ | async as user; else anonTemplate">
        <div class="text-light me-3 d-flex align-items-center">
          <i class="bi bi-person-circle fs-5 me-2"></i>
          <div>
            <span class="fw-semibold">{{ user.nombre }} {{ user.apellido }}</span>
            <span
              class="badge ms-2"
              [ngClass]="user.rol === 'Administrador' ? 'bg-danger' : 'bg-primary'"
            >
              {{ user.rol }}
            </span>
            <span *ngIf="user.sucursalId" class="badge bg-secondary ms-1">
              Sucursal #{{ user.sucursalId }}
            </span>
          </div>
        </div>
        <button class="btn btn-outline-light btn-sm" (click)="onLogout()">
          <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
        </button>
      </ng-container>

      <!-- Usuario Anónimo -->
      <ng-template #anonTemplate>
        <a class="btn btn-primary btn-sm" routerLink="/login">
          <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar sesión
        </a>
      </ng-template>
    </div>
  </div>
</nav>

<main class="container-fluid p-0">
  <router-outlet></router-outlet>
</main>
